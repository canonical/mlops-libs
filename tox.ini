[tox]
skipsdist = True
skip_missing_interpreters = True
envlist = lint, unit, integration, fmt

[vars]
src_path = {toxinidir}/src
tst_path = {toxinidir}/tests
lib_path = {toxinidir}/lib/charms/mlops_libs
all_path = {[vars]src_path} {[vars]tst_path} {[vars]lib_path}

[testenv]
basepython = python3
setenv = 
	PYTHONPATH = {toxinidir}:{toxinidir}/lib:{[vars]src_path}
	PYTHONBREAKPOINT=ipdb.set_trace
	PY_COLORS=1
passenv = 
	PYTHONPATH
	HOME
	PATH
	CHARM_BUILD_DIR
	MODEL_SETTINGS
	HTTP_PROXY
	HTTPS_PROXY
	NO_PROXY
deps = 
	poetry>=2.1.3

[testenv:update-requirements]
commands = 
	# updating all groups' locked dependencies:
	poetry lock --regenerate
description = Update requirements
skip_install = true

[testenv:fmt]
description = Apply coding style standards to code
commands = 
	ruff --fix {[vars]all_path}
	black {[vars]all_path}
commands_pre = 
	poetry install --only fmt
skip_install = true

[testenv:lint]
description = Check code against coding style standards
commands = 
	codespell {[vars]lib_path} \
	--skip *.lock
	codespell . --skip .git --skip .tox --skip build --skip venv --skip .mypy_cache \
	--skip *.lock
	ruff check {[vars]all_path}
	black --check --diff {[vars]all_path}
commands_pre = 
	poetry install --only lint
skip_install = true

[testenv:unit]
description = Run unit tests
commands = 
	coverage run \
	--source={[vars]lib_path} \
	-m pytest -v --tb native --log-cli-level=INFO -s {posargs} {[vars]tst_path}/unit
	coverage report
commands_pre = 
	poetry install --only unit,charm
skip_install = true

[testenv:integration]
description = Run integration tests
commands = 
	pytest -v --tb native --log-cli-level=INFO -s {posargs} {toxinidir}/tests/integration
commands_pre = 
	poetry install --only integration
skip_install = true
